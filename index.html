<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stacra, LLC.">
    <title>Stacra, LLC.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ba160c%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter+Tight:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #ba160c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30vh;
        }

        h1 {
            font-family: 'Inter Tight', Arial, sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: var(--brand);
        }

        .scanlines {
            width: 100vw;
            height: 38px;
            margin-top: 0;
            background: repeating-linear-gradient(
                0deg,
                var(--brand) 0,
                var(--brand) 10px,
                transparent 10px,
                transparent 14px
            );
        }

        .contact {
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--brand);
            text-decoration: underline;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <h1>STACRA</h1>
    <div class="scanlines"></div>
    <a href="mailto:contact@stacra.com" class="contact">CONTACT</a>
</body>
</html>
