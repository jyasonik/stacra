<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stacra, LLC.">
    <title>Stacra, LLC.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ba160c%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&family=Inter+Tight:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #ba160c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            color: var(--brand);
        }

        ::selection {
            background-color: var(--brand);
            color: #fff;
        }

        /* mirrors ../website: max-w-sm column, inner w-2/3, left-aligned */
        .box {
            width: 100%;
            max-width: 24rem;
            display: flex;
            justify-content: center;
        }

        .inner {
            width: 66.6667%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        h1 {
            font-family: 'Inter Tight', Arial, sans-serif;
            font-weight: 900;
            font-size: 24px;
            line-height: 1;
        }

        .contact {
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            line-height: 20px;
            color: var(--brand);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="inner">
            <h1>STACRA</h1>
            <a href="mailto:contact@stacra.com" class="contact">CONTACT</a>
        </div>
    </div>
</body>
</html>
